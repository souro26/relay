name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_test_password
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg://relay:relay_test_password@localhost:5432/relay_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+psycopg://relay:relay_test_password@localhost:5432/relay_test
          TEST_DATABASE_URL: postgresql+psycopg://relay:relay_test_password@localhost:5432/relay_test
        run: |
          pytest -v --run-integration --cov=relay --cov=order_service

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Relay API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: relay-api:test

      - name: Build Order Service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.order-service
          push: false
          tags: relay-order-service:test
