# ==============================================================================
# Render Blueprint Specification for Relay
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
# Free Tier Architecture:
# - relay-db: Managed PostgreSQL database on Render free tier
# - relay-api: Docker Web Service on Render free tier
#   * Automatically runs Alembic migrations on startup (RUN_MIGRATIONS=true)
#   * Starts internal order_service on 127.0.0.1:8001 (START_INTERNAL_ORDER_SERVICE=true)
#   * Serves Relay Web UI & API on the dynamic $PORT assigned by Render
#   * 100% Free Tier compliant (no extra container/cost needed for simulated order service)
# ==============================================================================

databases:
  - name: relay-db
    databaseName: relay
    user: relay
    plan: free
    region: oregon

services:
  - type: web
    name: relay-api
    runtime: docker
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      - key: ORDER_SERVICE_URL
        value: http://127.0.0.1:8001
      - key: START_INTERNAL_ORDER_SERVICE
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ENV
        value: production
