<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Relay - Mission-Critical Workflow Orchestrator{% endblock %}</title>
    
    <!-- Modern Enterprise Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js for Telemetry & Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Global Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <a href="{{ url_for('dashboard') }}" class="brand-wrapper">
                    <div class="brand-icon">R</div>
                    <span class="brand-title">Relay</span>
                    <span class="brand-tag">v1.0-prod</span>
                </a>

                <nav class="header-nav" aria-label="Main Navigation">
                    <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.url.path == '/' %}active{% endif %}">Overview</a>
                    <a href="{{ url_for('workflow_history') }}" class="nav-item {% if '/workflows' in request.url.path and not '/workflows/new' in request.url.path %}active{% endif %}">Workflow History</a>
                    <a href="{{ url_for('nl_request_form') }}" class="nav-item {% if '/request' in request.url.path or '/workflows/new' in request.url.path %}active{% endif %}">NL Request Studio</a>
                    <a href="/ready" target="_blank" class="nav-item">System Health</a>
                </nav>
            </div>

            <div class="header-right">
                <!-- Live System Health Pill -->
                <div id="system-health-pill" class="system-status-pill">
                    <span class="pulse-dot"></span>
                    <span id="health-text">System: Ready</span>
                    <span class="latency-badge" id="health-latency" style="display: none;"></span>
                </div>

                <!-- Docs Link -->
                <a href="https://github.com/souro26/relay" target="_blank" class="btn btn-secondary btn-sm" style="padding: 4px 10px; font-weight: 500;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                    <span>Docs</span>
                </a>

                <!-- Theme Toggle -->
                <button type="button" id="theme-toggle-btn" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
                    <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>

                <!-- Notifications -->
                <button type="button" class="icon-btn" aria-label="Notifications" style="position: relative;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>

                <!-- User Profile -->
                <div class="user-avatar" title="Relay Operator">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Injection -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div>
                <strong>Relay</strong> &mdash; Business Workflow Integration Platform
            </div>
            <div>
                Deterministic Process Orchestration &bull; Environment: Live
            </div>
        </div>
    </footer>

    <!-- App JavaScript -->
    <script src="{{ url_for('static', path='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
