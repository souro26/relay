{% extends "base.html" %}

{% block title %}Relay — Page Not Found{% endblock %}

{% block content %}
<div class="py-16 text-center max-w-md mx-auto space-y-4">
    <div class="w-16 h-16 rounded-full bg-pastel-rose-bg text-pastel-rose-text flex items-center justify-center mx-auto shadow-subtle border border-pastel-rose-border">
        <span class="material-symbols-outlined text-[32px]">error</span>
    </div>
    <div class="space-y-1">
        <div class="font-mono text-xs font-bold text-pastel-rose-text uppercase tracking-wider">404 ERROR</div>
        <h1 class="text-2xl font-bold text-chocolate-dark tracking-tight">Resource Not Found</h1>
        <p class="text-xs text-chocolate-muted">The requested page or workflow execution trace does not exist in persistent storage.</p>
    </div>
    <div class="pt-4 flex items-center justify-center gap-3">
        <a href="{{ url_for('dashboard') }}" class="px-4 py-2 rounded-lg bg-navy text-white hover:bg-navy-slate font-semibold text-xs transition-all shadow-card">
            Overview Dashboard
        </a>
        <a href="{{ url_for('workflow_history') }}" class="px-4 py-2 rounded-lg bg-cream-surface border border-cream-border text-chocolate-milk hover:bg-cream-well font-semibold text-xs transition-all shadow-subtle">
            Workflow History
        </a>
    </div>
</div>
{% endblock %}
